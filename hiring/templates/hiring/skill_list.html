{% extends "base.html" %}

{% block title %}Skills{% endblock %}

{% block content %}
  <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
    <h1 class="text-2xl font-bold">Skills</h1>
    <a href="{% url 'hiring:skill_create' %}" class="btn btn-primary">New skill</a>
  </div>
  <div class="overflow-x-auto bg-base-100 rounded-box shadow">
    <table class="table">
      <thead>
        <tr><th>Name</th><th>Job openings</th><th class="text-right">Actions</th></tr>
      </thead>
      <tbody>
        {% for skill in skills %}
          <tr class="hover">
            <td class="font-medium">{{ skill.name }}</td>
            <td>{{ skill.job_count }}</td>
            <td class="text-right">
              <a href="{% url 'hiring:skill_edit' skill.pk %}" class="btn btn-xs">Rename</a>
              <a href="{% url 'hiring:skill_delete' skill.pk %}" class="btn btn-xs btn-error btn-outline">Delete</a>
            </td>
          </tr>
        {% empty %}
          <tr><td colspan="3" class="text-center text-base-content/60">No skills yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
