{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <div class="card bg-base-100 shadow max-w-sm mx-auto mt-10">
    <div class="card-body">
      <h1 class="card-title text-2xl">Log in</h1>
      {% if form.non_field_errors %}
        <div role="alert" class="alert alert-error">
          {% for error in form.non_field_errors %}<span>{{ error }}</span>{% endfor %}
        </div>
      {% endif %}
      <form method="post" class="flex flex-col gap-3">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label class="form-control">
          <span class="label-text">Username</span>
          <input type="text" name="username" class="input input-bordered w-full" autocomplete="username" required autofocus>
        </label>
        <label class="form-control">
          <span class="label-text">Password</span>
          <input type="password" name="password" class="input input-bordered w-full" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
    </div>
  </div>
{% endblock %}
